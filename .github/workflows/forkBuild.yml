name: Fork Build

# Fork-only CI: builds the flashable Magisk zip + signed APK and uploads both as GitHub
# Actions artifacts named PixelXpert-<ref>-<short7hash>. Runs on every push to `patch`
# (artifacts only) and on every `fork-v*` tag push (artifacts + a published GitHub Release
# carrying the zip + APK as permanent, login-free downloads).
# Unlike upstream's workflows (which clone siavash79/PixelXpert directly), this checks
# out the fork's own code. If the SIGNING_KEY secret is absent the release build falls
# back to debug signing (see app/build.gradle.kts), so this stays green without secrets.

on:
  push:
    branches:
      - 'patch'
    tags:
      - 'fork-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed by the release step to create a GitHub Release on fork-v* tag builds.
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 21 Setup
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Gradlew Permissions
        run: chmod +x gradlew

      - name: Signature files preparation (optional)
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo storePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> ReleaseKey.properties
            echo keyAlias='${{ secrets.ALIAS }}' >> ReleaseKey.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> ReleaseKey.properties
            echo storeFile='${{ github.workspace }}/ReleaseKey.jks' >> ReleaseKey.properties
            echo ${{ secrets.SIGNING_KEY }} | base64 --decode > ${{ github.workspace }}/ReleaseKey.jks
          else
            echo "No SIGNING_KEY secret set -- release build will fall back to debug signing."
          fi

      - name: Gradle Build
        run: ./gradlew buildCanary -Pchannel=canary

      - name: Stage hash-named artifacts
        id: stage
        run: |
          SHORT="$(git rev-parse --short=7 HEAD)"
          BRANCH="${GITHUB_REF_NAME}"
          BASE="PixelXpert-${BRANCH}-${SHORT}"
          mkdir -p dist
          cp output/PixelXpert.zip "dist/${BASE}.zip"
          cp app/build/outputs/apk/release/PixelXpert.apk "dist/${BASE}.apk"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload Magisk zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.base }}-zip
          path: dist/${{ steps.stage.outputs.base }}.zip
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.base }}-apk
          path: dist/${{ steps.stage.outputs.base }}.apk
          if-no-files-found: error

      # Publish a permanent, login-free Release with the zip + APK -- only for fork-v* tags.
      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/fork-v')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.stage.outputs.base }}
        run: |
          # Use the annotated tag's own message as the release notes when present.
          NOTES="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          [ -z "$NOTES" ] && NOTES="Automated fork build for ${GITHUB_REF_NAME}."
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${BASE}.zip" \
            "dist/${BASE}.apk" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            --verify-tag
