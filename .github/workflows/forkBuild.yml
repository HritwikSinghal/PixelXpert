name: Fork Build

# Fork-only CI: builds the flashable Magisk zip + signed APK and uploads both as GitHub
# Actions artifacts named PixelXpert-<ref>-<short7hash>. Runs on every push to `patch`
# (artifacts only) and on every `fork-v*` tag push (artifacts + a published GitHub Release
# carrying the zip + APK as permanent, login-free downloads).
# Unlike upstream's workflows (which clone siavash79/PixelXpert directly), this checks
# out the fork's own code. If the SIGNING_KEY secret is absent, branch (artifact-only)
# builds fall back to debug signing (see app/build.gradle.kts) so they stay green; tag
# (fork-v*) builds, which publish a permanent public Release, instead fail fast -- a
# debug-signed public APK has a different/non-deterministic cert and would break future
# signed updates (INSTALL_FAILED_UPDATE_INCOMPATIBLE).

on:
  push:
    branches:
      - 'patch'
    tags:
      - 'fork-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede in-progress branch (artifact-only) builds, but never cancel a tag (release)
  # build: cancelling mid-publish can leave a half-published Release with missing assets.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed by the release step to create a GitHub Release on fork-v* tag builds.
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 21 Setup
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Gradlew Permissions
        run: chmod +x gradlew

      - name: Signature files preparation (optional)
        # Secrets are passed via env (not inline ${{ }} interpolation) and quoted, so a key
        # containing shell-special characters is decoded intact and never hits the command line.
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            {
              echo "storePassword=$KEY_STORE_PASSWORD"
              echo "keyAlias=$ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
              echo "storeFile=$WORKSPACE/ReleaseKey.jks"
            } >> ReleaseKey.properties
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$WORKSPACE/ReleaseKey.jks"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A fork-v* tag build publishes a permanent, public Release; refuse to ship a
            # debug-signed APK whose cert would break future signed updates.
            echo "::error::SIGNING_KEY secret is required for tag (release) builds; aborting."
            exit 1
          else
            echo "No SIGNING_KEY secret set -- release build will fall back to debug signing."
          fi

      - name: Gradle Build
        run: ./gradlew buildCanary -Pchannel=canary

      - name: Stage hash-named artifacts
        id: stage
        run: |
          SHORT="$(git rev-parse --short=7 HEAD)"
          # GITHUB_REF_NAME is the branch name on push-to-branch builds and the tag name on
          # tag builds, matching the documented PixelXpert-<ref>-<short7hash> naming.
          REF="${GITHUB_REF_NAME}"
          BASE="PixelXpert-${REF}-${SHORT}"
          mkdir -p dist
          cp output/PixelXpert.zip "dist/${BASE}.zip"
          cp app/build/distApk/PixelXpert.apk "dist/${BASE}.apk"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload Magisk zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.base }}-zip
          path: dist/${{ steps.stage.outputs.base }}.zip
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.base }}-apk
          path: dist/${{ steps.stage.outputs.base }}.apk
          if-no-files-found: error

      # Publish a permanent, login-free Release with the zip + APK -- only for fork-v* tags.
      # Notes = optional annotated-tag message (preamble) + an auto-generated changelog of
      # the commits landed since the previous fork-v* tag.
      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/fork-v')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.stage.outputs.base }}
        run: |
          # actions/checkout doesn't reliably fetch the annotated tag OBJECT (only the commit it
          # points to), so without this git would see a lightweight ref and skip the preamble.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
          # Optional preamble: an annotated tag's own message, used ONLY for genuine annotated tags.
          # For a lightweight tag, %(contents) resolves to the underlying commit message, so skip it.
          # Use subject+body (not %(contents)) so a signed tag's PGP signature block never leaks into
          # the notes.
          PREAMBLE=""
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag" ]; then
            PREAMBLE="$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}")"
          fi

          # Previous fork-v* tag (the most recently created one that isn't this tag) bounds
          # the changelog range. With none (the very first fork release) we cannot diff
          # against a prior tag, so cap at the most recent commits to avoid dumping the
          # entire inherited upstream history.
          PREV_TAG="$(git tag -l 'fork-v*' --sort=-creatordate \
            | grep -vxF "${GITHUB_REF_NAME}" | head -n1)"
          LOG_ARGS=(--no-merges --pretty=format:'- %s (%h)')
          if [ -n "$PREV_TAG" ]; then
            LOG_ARGS+=("${PREV_TAG}..${GITHUB_REF_NAME}")
            CHANGES_HEADER="## Changes since ${PREV_TAG}"
          else
            LOG_ARGS+=(-n 50 "${GITHUB_REF_NAME}")
            CHANGES_HEADER="## Changes (most recent 50 commits)"
          fi
          CHANGELOG="$(git log "${LOG_ARGS[@]}")"
          [ -n "$CHANGELOG" ] || CHANGELOG="- No code changes since ${PREV_TAG:-the start of history}."

          # Assemble the notes file: preamble (if any), then the changelog section.
          NOTES_FILE="$(mktemp)"
          {
            [ -n "$PREAMBLE" ] && printf '%s\n\n' "$PREAMBLE"
            printf '%s\n\n%s\n' "$CHANGES_HEADER" "$CHANGELOG"
          } > "$NOTES_FILE"

          # Idempotent publish: a re-run or a moved/re-pushed tag refreshes the existing
          # Release's assets AND notes instead of failing on "release already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/${BASE}.zip" \
              "dist/${BASE}.apk" \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$NOTES_FILE"
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/${BASE}.zip" \
              "dist/${BASE}.apk" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi
